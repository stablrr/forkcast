<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Forkcast">
<meta name="theme-color" content="#F2F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D0F" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Forkcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F2F3F0; --card:#FFFFFF; --card-2:#F6F7F4; --ink:#141619; --ink-2:#5B6068; --ink-3:#969BA3;
  --line:#E2E4E0; --track:#EAECE8; --accent:#141619; --on-accent:#FFFFFF;
  --protein:#E0464B; --carbs:#CF861C; --fat:#3A72EE; --good:#22915A; --bad:#D93D42;
  --shadow:0 1px 2px rgba(18,20,23,.04),0 6px 20px rgba(18,20,23,.06); --scrim:rgba(10,11,13,.42);
  --display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C0D0F; --card:#16181B; --card-2:#1E2124; --ink:#F1F2F0; --ink-2:#A3A8AF; --ink-3:#6C7279;
    --line:#282B2F; --track:#282B2F; --accent:#F1F2F0; --on-accent:#0C0D0F;
    --protein:#FF6B70; --carbs:#F0A845; --fat:#6F9BFF; --good:#4CC483; --bad:#FF6B70;
    --shadow:none; --scrim:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C0D0F; --card:#16181B; --card-2:#1E2124; --ink:#F1F2F0; --ink-2:#A3A8AF; --ink-3:#6C7279;
  --line:#282B2F; --track:#282B2F; --accent:#F1F2F0; --on-accent:#0C0D0F;
  --protein:#FF6B70; --carbs:#F0A845; --fat:#6F9BFF; --good:#4CC483; --bad:#FF6B70;
  --shadow:none; --scrim:rgba(0,0,0,.62);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);-webkit-tap-highlight-color:transparent;font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 128px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.03em}
.brand svg{width:26px;height:26px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;box-shadow:var(--shadow)}
.pill svg{width:16px;height:16px;color:var(--carbs)}

.week{display:flex;align-items:center;gap:4px}
.week-nav{width:28px;height:28px;display:grid;place-items:center;color:var(--ink-3);border-radius:50%}
.week-nav:hover{color:var(--ink)}
.week-nav svg{width:16px;height:16px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border-radius:12px;color:var(--ink-2)}
.day .dw{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day .dn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums;border:1.5px dashed var(--line)}
.day.logged .dn{border:1.5px solid var(--ink-3)}
.day.today .dw{color:var(--ink)}
.day.sel .dn{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.day.future{opacity:.45}

.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.cal{display:flex;align-items:center;justify-content:space-between;padding:22px 20px;gap:12px;width:100%;text-align:left}
.cal .big{font-size:46px;font-weight:700;line-height:1}
.cal .lbl{color:var(--ink-2);font-weight:500;margin-top:6px}
.cal .sub{color:var(--ink-3);font-size:13px;margin-top:10px}
.over{color:var(--bad)}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring-in{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink)}
.ring-in svg{width:26px;height:26px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{padding:14px 12px 16px;display:flex;flex-direction:column;gap:12px}
.macro .v{font-size:21px;font-weight:600;line-height:1}
.macro .l{color:var(--ink-2);font-size:13px;margin-top:4px}
.macro .ring{align-self:center}
.mletter{font-family:var(--display);font-weight:700;font-size:15px}

.banner{background:var(--card-2);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;color:var(--ink-2);font-size:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.sec-h h2{font-family:var(--display);font-size:18px;font-weight:600;margin:0;letter-spacing:-.02em}
.sec-h span{color:var(--ink-3);font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.entry{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px;align-items:center;width:100%;text-align:left}
.thumb{width:72px;height:72px;border-radius:15px;object-fit:cover;background:var(--card-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;color:var(--ink-3);overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.e-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.e-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-time{color:var(--ink-3);font-size:12px;flex:none;background:var(--card-2);padding:2px 8px;border-radius:999px}
.e-kcal{display:flex;align-items:center;gap:4px;font-weight:600;margin-top:2px}
.e-kcal svg{width:14px;height:14px}
.e-mac{display:flex;gap:12px;color:var(--ink-2);font-size:13px;margin-top:4px;flex-wrap:wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.chip{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--card-2);color:var(--ink-2);margin-left:6px;vertical-align:2px}
.empty{padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.pending .thumb::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.spin{position:absolute;z-index:1;width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .9s linear infinite}
.pending .thumb.noimg .spin{border-color:var(--line);border-top-color:var(--ink)}
.pending .thumb.noimg::after{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.shimmer{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--track),var(--card-2),var(--track));background-size:200% 100%;animation:sh 1.3s linear infinite;margin-top:8px}
@keyframes sh{to{background-position:-200% 0}}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.linkbtn{color:var(--ink);font-weight:600;font-size:13px;text-decoration:underline;margin-top:6px}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabbar-in{max-width:480px;margin:0 auto;display:flex;align-items:center;padding:8px 16px;gap:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink-3);padding:4px 0;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;margin-left:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:90%;overflow:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--display);font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.02em}
.sheet .hint{color:var(--ink-2);font-size:14px;margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--card-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;font-weight:600;min-height:108px}
.opt svg{width:26px;height:26px}
.opt small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.opt[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{background:var(--card-2);border:1px solid var(--line);border-radius:12px;height:46px;padding:0 12px;width:100%;min-width:0;font-size:16px;color:var(--ink)}
textarea.inp{height:auto;min-height:92px;padding:12px;resize:vertical;line-height:1.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{height:50px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--card-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}

.hero{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:18px;display:block}
.name-inp{font-family:var(--display);font-size:20px;font-weight:600;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0;width:100%;letter-spacing:-.02em}
.meta{color:var(--ink-3);font-size:13px}
.serv{display:flex;align-items:center;justify-content:space-between;background:var(--card-2);border-radius:16px;padding:8px 8px 8px 16px}
.serv .ctl{display:flex;align-items:center;gap:6px}
.serv button{width:36px;height:36px;border-radius:50%;background:var(--card);font-size:20px;font-weight:600;display:grid;place-items:center}
.serv .n{min-width:40px;text-align:center;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card-2);border-radius:14px;padding:10px 12px}
.tile .l{font-size:12px;color:var(--ink-2);display:flex;align-items:center}
.tile .v{font-size:18px;font-weight:600;margin-top:2px}
.kcal-tile{background:var(--card-2);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.kcal-tile svg{width:24px;height:24px}
.kcal-tile .v{font-size:28px;font-weight:700;line-height:1}
.kcal-tile .l{color:var(--ink-2);font-size:13px}
.hs{display:flex;flex-direction:column;gap:8px;background:var(--card-2);border-radius:16px;padding:12px 16px}
.hs-top{display:flex;justify-content:space-between;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.items{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item small{display:block;color:var(--ink-3);font-size:12.5px}
.item .k{font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.subh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:6px 0 -4px}

.pcard{padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.pcard h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .v{font-size:22px;font-weight:600}
.stat .l{font-size:12.5px;color:var(--ink-2)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:10px;font-family:var(--body)}
.seg{display:inline-flex;background:var(--card-2);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.note{color:var(--ink-3);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.cal .big{font-size:38px}.macro .v{font-size:18px}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3"/><path d="M16 3a13 13 0 0 1 12.4 9" fill="none" stroke="var(--protein)" stroke-width="3" stroke-linecap="round"/><path d="M13 10v5a3 3 0 0 0 6 0v-5M16 10v13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      Forkcast
    </div>
    <div class="pill" id="streak" title="Day streak"></div>
  </header>
  <section id="view-home" class="stack"></section>
  <section id="view-progress" class="stack" hidden></section>
  <section id="view-goals" class="stack" hidden></section>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="tabbar-in">
    <button class="tab on" data-action="tab" data-tab="home" id="tab-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="tab" data-action="tab" data-tab="progress" id="tab-progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
    <button class="tab" data-action="tab" data-tab="goals" id="tab-goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Goals</button>
    <button class="fab" data-action="openAdd" aria-label="Log food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayKey = () => keyOf(new Date());
const fmt = n => Math.round(n).toLocaleString();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = v => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KG_LB = 2.20462;

const I = {
  flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.6 2.2c.6 3.3-1.9 4.9-1.9 7.4 0 1.4 1.1 2.4 2.4 2.4 1.4 0 2.4-1.1 2.4-2.6 2.1 1.7 3.5 4.1 3.5 6.6a7 7 0 0 1-14 0c0-4.8 4.9-7.3 7.6-13.8z"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  text: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 11h16M4 16h10"/><path d="M17 15l2 2 3-4"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',
  scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 9a5 5 0 0 1 8 0M12 9l1.5-2"/></svg>',
  chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chevR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
};
const MAC = [
  { k: "protein", label: "Protein", color: "var(--protein)", L: "P" },
  { k: "carbs", label: "Carbs", color: "var(--carbs)", L: "C" },
  { k: "fat", label: "Fat", color: "var(--fat)", L: "F" },
];

function ring(size, sw, pct, color, inner = "") {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, p = clamp(pct || 0, 0, 1), h = size / 2;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-opacity="${p > 0 ? 1 : 0}"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 ${h} ${h})" style="transition:stroke-dashoffset .5s ease"/>
  </svg><div class="ring-in">${inner}</div></div>`;
}

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600);
}

/* ---------- targets ---------- */
const DEFAULT_PROFILE = {
  units: "imperial", sex: "female", age: 30, heightCm: 168, weightKg: 72, goalWeightKg: 66,
  activity: 1.375, goal: "lose", paceLb: 1, targets: null, loggedDays: [], hasLogged: false,
};
function calcTargets(p) {
  const bmr = 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + (p.sex === "male" ? 5 : -161);
  const delta = p.goal === "lose" ? -p.paceLb * 500 : p.goal === "gain" ? p.paceLb * 350 : 0;

const PREFIX = "forkcast:";
const store = {
  async get(k) {

  },
  save(k, val) {

function makeSample() {

    bars += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" style="${c.k === tk ? "fill:var(--ink);font-weight:700" : ""}">${d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2)}</text>`;
  });
  bars += `<line x1="${padL}" x2="${W - 4}" y1="${sy(t.calories)}" y2="${sy(t.calories)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W - 4}" y="${sy(t.calories) - 5}" text-anchor="end" style="fill:var(--good)">Goal ${fmt(t.calories)}</text>`;

  // weight line
  const we = [...weights.entries].sort((a, b) => a.d.localeCompare(b.d)).slice(-30);
  const pts = we.length ? we : [{ d: tk, kg: profile.weightKg }];
  const vals = pts.map(p => toU(p.kg)), goalU = toU(profile.goalWeightKg);
  let lo = Math.min(...vals, goalU), hi = Math.max(...vals, goalU);
  const span = Math.max(hi - lo, imp ? 4 : 2); lo -= span * 0.15; hi += span * 0.15;
  const WH = 150, wy = v => padT + (WH - padB - padT) - (v - lo) / (hi - lo) * (WH - padB - padT);
  const wx = i => pts.length === 1 ? padL + cw / 2 : padL + 6 + (cw - 12) * i / (pts.length - 1);
  let wl = "";
  for (const tv of [lo + (hi - lo) * 0.15, (lo + hi) / 2, hi - (hi - lo) * 0.15]) wl += `<line x1="${padL}" x2="${W - 4}" y1="${wy(tv)}" y2="${wy(tv)}" stroke="var(--line)"/><text x="${padL - 6}" y="${wy(tv) + 3}" text-anchor="end">${tv.toFixed(0)}</text>`;
  wl += `<line x1="${padL}" x2="${W - 4}" y1="${wy(goalU)}" y2="${wy(goalU)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W - 4}" y="${wy(goalU) - 5}" text-anchor="end" style="fill:var(--good)">Goal ${goalU.toFixed(1)}</text>`;
  if (pts.length > 1) {
    const line = pts.map((p, i) => `${i ? "L" : "M"}${wx(i).toFixed(1)},${wy(vals[i]).toFixed(1)}`).join("");
    wl += `<path d="${line}L${wx(pts.length - 1)},${WH - padB}L${wx(0)},${WH - padB}Z" fill="var(--ink)" fill-opacity=".06"/><path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
  }
  const li = pts.length - 1;
  wl += `<circle cx="${wx(li)}" cy="${wy(vals[li])}" r="5" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/>`;
  const dl = k => parseKey(k).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  wl += `<text x="${wx(0)}" y="${WH - 6}" text-anchor="${pts.length > 1 ? "start" : "middle"}">${dl(pts[0].d)}</text>`;
  if (pts.length > 1) wl += `<text x="${wx(li)}" y="${WH - 6}" text-anchor="end">${dl(pts[li].d)}</text>`;

  const cur = toU(profile.weightKg), toGo = cur - goalU;
  $("#view-progress").innerHTML = `
    <div class="card pcard">
      <h2>This week</h2>
      <div class="stats">
        <div class="stat"><div class="v num">${streak()}</div><div class="l">Day streak</div></div>
        <div class="stat"><div class="v num">${loggedDaysN}/7</div><div class="l">Days logged</div></div>
        <div class="stat"><div class="v num">${fmt(avg)}</div><div class="l">Avg kcal / day</div></div>
      </div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories eaten each of the last 7 days">${bars}</svg>
    </div>
    <div class="card pcard">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2>Weight</h2><button class="btn ghost" style="height:38px;font-size:14px" data-action="logWeight">Log weight</button></div>
      <div class="stats">
        <div class="stat"><div class="v num">${cur.toFixed(1)}</div><div class="l">Current ${wu}</div></div>
        <div class="stat"><div class="v num">${goalU.toFixed(1)}</div><div class="l">Goal ${wu}</div></div>
        <div class="stat"><div class="v num">${Math.abs(toGo).toFixed(1)}</div><div class="l">${wu} to ${toGo > 0 ? "lose" : toGo < 0 ? "gain" : "go"}</div></div>
      </div>
      <svg class="chart" viewBox="0 0 ${W} ${WH}" role="img" aria-label="Weight over time">${wl}</svg>
      ${we.length < 2 ? `<div class="note">Log your weight a few times to see your trend.</div>` : ""}
    </div>`;
}

function render() {
  const s = streak();
  $("#streak").innerHTML = `${I.flame}<span class="num">${s}</span>`;
  $("#streak").setAttribute("aria-label", `${s} day streak`);
  for (const v of ["home", "progress", "goals"]) {
    $("#view-" + v).hidden = v !== tab;
    $("#tab-" + v).classList.toggle("on", v === tab);
  }
  if (tab === "home") renderHome();
  else if (tab === "progress") renderProgress();
  else renderGoals();
}
function setTab(t) { tab = t; render(); window.scrollTo({ top: 0 }); }

/* ---------- sheets ---------- */
let onSheetClose = null;
function openSheet(html, mount, onClose) {
  $("#sheet").innerHTML = `<div class="grab"></div>${html}`;
  $("#scrim").hidden = false;
  onSheetClose = onClose || null;
  mount && mount($("#sheet"));
}
function closeSheet() {
  const fn = onSheetClose; onSheetClose = null;
  $("#scrim").hidden = true; $("#sheet").innerHTML = "";
  fn && fn();
}
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#scrim").hidden) closeSheet(); });

async function openAdd() {
  if (aiState === "loading") { toast("Connecting to Claude…"); await aiReady; }
  if (sample && !canImages) { try { canImages = !!(await sample.limits()).images; } catch {} }   // re-check: an early check can come back too soon
  const aiOff = aiState === "off", noImg = aiOff || !canImages;
  const why = aiOff
    ? `<p class="note" style="margin:0 0 12px">Claude isn't connected on this screen. ${aiWhy || "Add your Claude API key in Goals → Claude connection to turn on photo scanning."}</p>`
    : noImg ? `<p class="note" style="margin:0 0 12px">This screen can't send photos to Claude. Use Describe it, or open the page in Safari on claude.ai.</p>` : "";
  openSheet(`<h3>Log food</h3><p class="hint">${selected === todayKey() ? "Adding to today." : `Adding to ${parseKey(selected).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}.`}</p>
    ${why}
    <div class="opts">
      <button class="opt" id="oScan" ${noImg ? "disabled" : ""}>${I.camera}<span>Scan food<small>${aiOff ? "Claude not connected" : noImg ? "Photos not supported here" : "Photo of your plate"}</small></span></button>
      <button class="opt" id="oText" ${aiOff ? "disabled" : ""}>${I.text}<span>Describe it<small>${aiOff ? "Claude not connected" : "Type what you ate"}</small></span></button>
      <button class="opt" id="oMan">${I.pencil}<span>Manual entry<small>Enter the numbers</small></span></button>
      <button class="opt" id="oW">${I.scale}<span>Log weight<small>Track your progress</small></span></button>
    </div>`, s => {

$("#photoInput").addEventListener("change", e => { const f = e.target.files?.[0]; if (f) analyze({ file: f }); });

function openDescribe() {

    <div class="stack"><textarea class="inp" id="dText" placeholder="2 scrambled eggs, a slice of sourdough with butter, and an oat milk latte"></textarea>
    <button class="btn" id="dGo">Estimate</button></div>`, s => {

    <form class="stack" id="mForm">

function openWeight() {
  const imp = profile.units === "imperial";
  openSheet(`<h3>Log weight</h3><p class="hint">Saved for today, ${new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" })}.</p>
    <form class="stack" id="wForm"><label class="f">Weight ${imp ? "lb" : "kg"}<input class="inp num" id="wVal" inputmode="decimal" value="${(imp ? profile.weightKg * KG_LB : profile.weightKg).toFixed(1)}"></label>
    <button class="btn" type="submit">Save weight</button></form>`, s => {
    const inp = s.querySelector("#wVal"); inp.focus(); inp.select();
    s.querySelector("#wForm").onsubmit = e => {
      e.preventDefault();
      const v = num(inp.value); if (!v) { inp.focus(); return; }
      const kg = imp ? v / KG_LB : v, d = todayKey();
      weights.entries = weights.entries.filter(x => x.d !== d).concat({ d, kg: Math.round(kg * 100) / 100 }).sort((a, b) => a.d.localeCompare(b.d)).slice(-730);
      profile.weightKg = Math.round(kg * 100) / 100;
      store.save("weights", weights); saveProfile();
      closeSheet(); toast("Weight saved"); setTab("progress");
    };
  });
}

function openEntry(id) {
  const k = selected, src = dayEntries(k).find(e => e.id === id);
  if (!src) return;
  const isEx = !!src.example;
  const draft = JSON.parse(JSON.stringify(src));
  let deleteArmed = false, fixing = false, fixErr = "", removed = false;
  const commit = () => {
    if (isEx || removed) return;
    if (JSON.stringify(draft) === JSON.stringify(src)) return;
    const d = days[k], i = d.entries.findIndex(e => e.id === id);
    if (i >= 0) { d.entries[i] = draft; saveDay(k); render(); }
  };
  const draw = () => {
    const s = scaled(draft), hs = draft.healthScore;
    const hsColor = hs >= 7 ? "var(--good)" : hs >= 4 ? "var(--carbs)" : "var(--bad)";
    const time = new Date(draft.t).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });
    const srcLbl = { photo: "Photo scan", text: "Described", manual: "Manual entry" }[draft.source] || "";
    const canFix = !isEx && aiState !== "off" && draft.source !== "manual";
    $("#sheet").innerHTML = `<div class="grab"></div><div class="stack">
      ${draft.photo ? `<img class="hero" src="${draft.photo}" alt="">` : ""}
      <div><input class="name-inp" id="eName" value="${esc(draft.name)}" aria-label="Meal name" ${isEx ? "readonly" : ""}>
        <div class="meta" style="margin-top:6px">${time} · ${srcLbl}${draft.confidence ? ` · ${draft.confidence} confidence` : ""}${isEx ? '<span class="chip">Sample</span>' : ""}</div></div>
      <div class="serv"><span style="font-weight:600">Servings</span><div class="ctl">
        <button id="sMinus" aria-label="Fewer servings">−</button><span class="n num">${draft.servings}</span><button id="sPlus" aria-label="More servings">+</button></div></div>
      <div class="kcal-tile"><span style="color:var(--ink)">${I.flame}</span><div><div class="v num">${fmt(s.calories)}</div><div class="l">Calories</div></div></div>
      <div class="tiles">${MAC.map(m => `<div class="tile"><div class="l"><i class="dot" style="background:${m.color}"></i>${m.label}</div><div class="v num">${fmt(s[m.k])}g</div></div>`).join("")}</div>
      ${hs ? `<div class="hs"><div class="hs-top"><span>Health score</span><span class="num">${hs}/10</span></div><div class="bar"><i style="width:${hs * 10}%;background:${hsColor}"></i></div></div>` : ""}
      ${draft.items?.length > 1 || draft.source !== "manual" ? `<div class="subh">Ingredients</div><div class="items">${draft.items.map(i => `<div class="item"><div>${esc(i.name)}<small>${esc(i.portion)}</small></div><span class="k">${fmt(i.calories * draft.servings)} kcal</span></div>`).join("")}</div>` : ""}
      ${draft.note && !isEx ? `<div class="note">${esc(draft.note)}</div>` : ""}
      ${canFix ? `<div class="subh">Fix results</div>
        <textarea class="inp" id="eFix" placeholder="It was a half portion, and the dressing was on the side" ${fixing ? "disabled" : ""}></textarea>
        ${fixErr ? `<div class="err">${esc(fixErr)}</div>` : ""}
        <button class="btn ghost" id="eFixGo" ${fixing ? "disabled" : ""}>${fixing ? "Updating estimate…" : "Fix with Claude"}</button>` : ""}
      ${isEx ? `<p class="note">This is a sample meal. Log your own with the + button.</p><button class="btn" id="eDone">Close</button>`
             : `<div class="btns"><button class="btn danger" id="eDel">${deleteArmed ? "Tap again to delete" : "Delete"}</button><button class="btn" id="eDone">Done</button></div>`}
    </div>`;
    const sh = $("#sheet");
    sh.querySelector("#eName").oninput = e => { draft.name = e.target.value.slice(0, 60) || "Meal"; };
    sh.querySelector("#sMinus").onclick = () => { draft.servings = Math.max(0.5, draft.servings - 0.5); draw(); };
    sh.querySelector("#sPlus").onclick = () => { draft.servings = Math.min(10, draft.servings + 0.5); draw(); };
    sh.querySelector("#eDone").onclick = closeSheet;
    const del = sh.querySelector("#eDel");
    if (del) del.onclick = () => {
      if (!deleteArmed) { deleteArmed = true; draw(); return; }
      removed = true;
      days[k].entries = days[k].entries.filter(e => e.id !== id);
      saveDay(k); closeSheet(); render(); toast("Meal deleted");
    };
    const fixGo = sh.querySelector("#eFixGo");
    if (fixGo) fixGo.onclick = async () => {
      const fix = sh.querySelector("#eFix").value.trim();
      if (!fix) { sh.querySelector("#eFix").focus(); return; }
      fixing = true; fixErr = ""; draw();
      try {
        if (aiState === "loading") await aiReady;
        if (!sample) throw { code: "not_granted" };
        const est = normalize(await sample.json(fixPrompt(draft, fix)));
        Object.assign(draft, est);
      } catch (e) { markAiOff(e); fixErr = aiErr(e); }
      fixing = false;
      if (!$("#scrim").hidden) draw();
    };
  };
  openSheet("", null, commit);
  draw();
}

/* ---------- actions ---------- */
const actions = {
  tab: el => setTab(el.dataset.tab),
  pickDay: async el => { selected = el.dataset.k; await loadDay(selected); render(); },
  week: async el => {
    let d = addDays(parseKey(selected), Number(el.dataset.d));
    if (keyOf(d) > todayKey()) d = new Date();
    selected = keyOf(d); await loadDay(selected); render();
  },
  toggleCal: () => { showLeft = !showLeft; render(); },
  openAdd,
  openEntry: el => openEntry(el.dataset.id),
  logWeight: openWeight,
  dismiss: el => { pending = pending.filter(p => p.id !== el.dataset.id); render(); },
  retry: el => {
    const p = pending.find(x => x.id === el.dataset.id); if (!p) return;
    pending = pending.filter(x => x !== p);
    selected = p.dayKey; analyze({ file: p.file, text: p.text });
  },
  units: el => { profile.units = el.dataset.u; saveProfile(); render(); },
  saveKey: () => {
    const k = $("#kKey").value.trim();
    if (k && !k.startsWith("sk-ant-")) { toast("That doesn't look like an Anthropic key. It starts with sk-ant-"); return; }
    if (k) settings.key = k;
    settings.model = $("#kModel").value;
    if (!settings.key) { toast("Paste your API key first"); return; }
    saveSettings(); sample = makeSample(); aiState = "on"; aiWhy = "";
    render(); toast("Saved. Photo scanning is on.");
  },
  testKey: async el => {
    const typed = $("#kKey").value.trim(), prev = { ...settings };
    if (typed) settings.key = typed;
    settings.model = $("#kModel").value;
    if (!settings.key) { toast("Paste your API key first"); return; }
    el.disabled = true; el.textContent = "Testing…";
    try {
      const r = await makeSample().json('Reply with only this JSON: {"ok": true}');
      toast(r?.ok ? "It works. Tap Save to keep it." : "Connected, but the reply was unexpected.");
    } catch (e) { toast(aiErr(e)); }
    Object.assign(settings, prev);          // testing never saves
    el.disabled = false; el.textContent = "Test";
  },
  removeKey: () => { settings.key = ""; saveSettings(); sample = null; aiState = "off"; render(); toast("Key removed from this device"); },
  exportData: () => {
    const out = {};
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(PREFIX) && k !== PREFIX + "settings") out[k.slice(PREFIX.length)] = JSON.parse(localStorage.getItem(k)); } } catch {}
    const blob = new Blob([JSON.stringify({ app: "forkcast", version: 1, exported: new Date().toISOString(), data: out })], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `forkcast-backup-${todayKey()}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },
  importData: () => { $("#importFile").value = ""; $("#importFile").click(); },
};
document.addEventListener("change", async e => {
  if (e.target.id !== "importFile" || !e.target.files?.[0]) return;
  try {
    const j = JSON.parse(await e.target.files[0].text());
    if (j?.app !== "forkcast" || typeof j.data !== "object") throw 0;
    for (const [k, v] of Object.entries(j.data)) if (k !== "settings") store.save(k, v);
    await loadAll(); render(); toast("Backup imported");
  } catch { toast("That file isn't a Forkcast backup"); }
});
Object.assign(actions, {
  saveTargets: () => {
    const v = id => Math.round(num($(id).value));
    const t = { calories: v("#tCal"), protein: v("#tP"), carbs: v("#tC"), fat: v("#tF") };
    if (t.calories < 500) { toast("Set calories to at least 500"); return; }
    profile.targets = t; saveProfile(); render(); toast("Targets saved");
  },
  savePlan: () => {
    const imp = profile.units === "imperial", v = id => num($(id).value);
    const heightCm = imp ? (v("#fFt") * 12 + v("#fIn")) * 2.54 : v("#fCm");
    const weightKg = imp ? v("#fW") / KG_LB : v("#fW"), goalWeightKg = imp ? v("#fGW") / KG_LB : v("#fGW");
    const age = Math.round(v("#fAge"));
    if (heightCm < 100 || heightCm > 250) { toast("Check your height"); return; }
    if (weightKg < 30 || weightKg > 350 || goalWeightKg < 30 || goalWeightKg > 350) { toast("Check your weights"); return; }
    if (age < 13 || age > 100) { toast("Age must be between 13 and 100"); return; }
    Object.assign(profile, {
      sex: $("#fSex").value, age, heightCm: Math.round(heightCm * 10) / 10,
      weightKg: Math.round(weightKg * 100) / 100, goalWeightKg: Math.round(goalWeightKg * 100) / 100,
      activity: Number($("#fAct").value), goal: $("#fGoal").value, paceLb: Number($("#fPace").value),
    });
    profile.targets = calcTargets(profile);
    saveProfile(); render(); toast(`Plan updated: ${fmt(profile.targets.calories)} kcal a day`);
  },
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (el && !el.disabled && actions[el.dataset.action]) actions[el.dataset.action](el, e);
});

/* ---------- boot ---------- */
const settings = loadSettings();
sample = settings.key ? makeSample() : null;
aiState = sample ? "on" : "off";
canImages = true;
const aiReady = Promise.resolve();
if (!settings.key) tab = "goals";        // first run: start on the key setup
(async () => {
  await loadAll(); render();
  if (!settings.key) document.getElementById("claudeCard")?.scrollIntoView({ block: "center" });
})();
</script>
</body>
</html>
